<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Vida Plena Internacional</title>
    <script>
      // Single Page App redirect for GitHub Pages custom domains
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace("/" + (path.charAt(0) === "/" ? path.slice(1) : path) + search + hash);
    </script>
  </head>
  <body>
  </body>
</html>
