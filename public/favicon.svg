  <!-- Solid Black Background as in official logo -->
  <rect width="240" height="120" fill="#000000" />
  
  <!-- Red Worshipping Person Figure (Vida Plena Symbol) -->
  <circle cx="54" cy="30" r="16" fill="#e50914" />
  <path d="M 8 36 C 26 45, 42 48, 50 46 C 58 44, 80 28, 108 14 C 94 32, 74 48, 65 58 C 57 68, 50 92, 44 110 C 42 90, 36 68, 28 54 C 20 44, 12 38, 8 36 Z" fill="#e50914" />
  
  <!-- "Vida Plena" in flowing script white -->
  <text x="116" y="62" fill="#ffffff" font-family="'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive, sans-serif" font-size="36" font-style="italic" font-weight="bold">Vida Plena</text>
  
  <!-- "Internacional" in clean sans-serif white -->
  <text x="118" y="86" fill="#ffffff" font-family="'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">Internacional</text>
